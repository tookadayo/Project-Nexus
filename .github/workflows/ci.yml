name: NEXUS CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check:secrets
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - name: Build with bounded resource diagnostics
        id: build
        run: node .github/scripts/ci-build.mjs corepack pnpm run build --concurrency=1
      - id: chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
        env:
          NEXUS_E2E_CONNECTION_RESET_OBSERVE: "1"
          NODE_OPTIONS: --require="${{ github.workspace }}/tests/e2e/connection-reset-observer.cjs"
      - run: corepack pnpm exec playwright test --config playwright.alpha15-scratch-acceptance.config.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
      - run: corepack pnpm exec playwright test --config playwright.alpha15-datetime-setup.config.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
      - run: corepack pnpm exec playwright test --config playwright.alpha15-datetime-v2.config.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
      - run: corepack pnpm exec playwright test --config playwright.alpha17.config.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
      - run: corepack pnpm exec playwright test --config playwright.verification.config.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
      - run: corepack pnpm exec playwright test --config playwright.checkout.config.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
      - run: corepack pnpm exec playwright test --config playwright.discord.config.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
      - run: corepack pnpm test:integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          NEXUS_TEST_INFRA: docker
      - run: corepack pnpm test:performance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          NEXUS_TEST_INFRA: docker
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:runtime
        shell: pwsh
